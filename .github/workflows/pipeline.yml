name: pipeline
on: pull_request

permissions:
  contents: read
  pull-requests: write

jobs:
  conformance-server:
    runs-on: ${{ matrix.operating-system }}
    strategy:
      matrix:
        operating-system: [ 'ubuntu-latest', 'macos-latest' ] # 'windows-latest',
        extension: [ pcntl, event, ev, swoole, swow, fiber ]
        exclude:
          - operating-system: 'windows-latest'
            extension: 'event'
          - operating-system: 'windows-latest'
            extension: 'swoole'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: "none"
          tools: composer,pie
          extensions: ${{ matrix.extension }}, fileinfo
        env:
          fail-fast: ${{ matrix.extension != 'swow' && matrix.extension != 'fiber' }}

      - name: Install swow (Linux with sudo)
        if: ${{ matrix.extension == 'swow' && runner.os == 'Linux' }}
        run: sudo pie install swow/swow-extension

      - name: Install swow (Windows/macOS)
        if: ${{ matrix.extension == 'swow' && (runner.os == 'Windows' || runner.os == 'macOS') }}
        run: sudo pie install swow/swow-extension --skip-enable-extension

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: php-${{ matrix.php }}-composer-locked-${{ hashFiles('composer.lock') }}
          restore-keys: php-${{ matrix.php }}-composer-locked-

      - name: Install Composer
        uses: ramsey/composer-install@v4

      - name: Install revolt
        if: ${{ matrix.extension == 'fiber' }}
        run: composer require revolt/event-loop

      - name: Start conformance server
        run: php tests/Conformance/server.php start -d &

      - uses: modelcontextprotocol/conformance@v0.1.16
        with:
          node-version: 22
          mode: server
          suite: all
          verbose: true
          output-dir: ./results
          url: http://localhost:8000/mcp
          expected-failures: ./tests/Conformance/conformance-baseline.yml

      # - name: Upload conformance results
      #   if: always()
      #   uses: actions/upload-artifact@v6
      #   with:
      #     name: conformance-results
      #     path: ./results
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: [ '8.1', '8.2', '8.3', '8.4', '8.5' ]
        dependencies: [ 'lowest', 'highest' ]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: webman_mcp_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      MCP_TEST_DB_HOST: 127.0.0.1
      MCP_TEST_DB_PORT: 3306
      MCP_TEST_DB_DATABASE: webman_mcp_test
      MCP_TEST_DB_USERNAME: root
      MCP_TEST_DB_PASSWORD: root
      MCP_TEST_REDIS_HOST: 127.0.0.1
      MCP_TEST_REDIS_PORT: 6379
      MCP_TEST_REDIS_DATABASE: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, redis
          coverage: pcov

      - name: Install Composer
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: ${{ matrix.dependencies }}
      - name: Tests
        run: vendor/bin/phpunit --testsuite=unit --coverage-clover=coverage.xml

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: "none"

      - name: Composer Validation
        run: composer validate --strict

      - name: Install Composer
        uses: ramsey/composer-install@v4

      - name: Code Style PHP
        run: vendor/bin/php-cs-fixer fix --dry-run

      - name: PHPStan
        run: vendor/bin/phpstan analyse